# Lance le zip vendu (dist/) sur les Mac de GitHub, Intel et puce Apple, et rapporte des captures d'écran.
name: Test Flocon Mac
on: workflow_dispatch
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Dézipper comme un acheteur
        run: |
          ditto -x -k dist/Flocon-Mac-*.zip out
          mv out/Flocon*/Flocon.app /Applications/
          codesign --verify --deep --strict /Applications/Flocon.app
      - name: Test interne et diagnostic
        run: |
          /Applications/Flocon.app/Contents/MacOS/Flocon --selftest
          /Applications/Flocon.app/Contents/MacOS/Flocon --diag | tee diag.txt
      - name: Premier lancement (écran d'accueil)
        run: |
          mkdir shots
          open /Applications/Flocon.app
          sleep 10
          pgrep -x Flocon
          screencapture -x shots/1-accueil.png
          pkill -x Flocon
      - name: Lancement normal, avec une fenêtre ouverte
        run: |
          . mac/tests/outils.sh
          defaults write com.yessen.flocon accueilli -bool true
          defaults write com.yessen.flocon cadence -float 1
          swiftc -O mac/tests/fenetre.swift -o fenetre-test
          swiftc -O mac/tests/souris.swift -o souris
          ./fenetre-test &
          sleep 3
          open /Applications/Flocon.app --args --pilote
          sleep 50
          photo 2-neige-50s
      - name: Boule de neige roulée à la souris
        run: |
          . mac/tests/outils.sh
          # dans la neige posée sur la fenêtre de test (haut à 150 pt)
          essai ./souris 230 670 147
          sleep 1
          photo 7-boule
      - name: Fenêtre déplacée, rétrécie, ouverte, fermée
        run: |
          . mac/tests/outils.sh
          fenetre '100 250 500 350'
          sleep 2
          photo 3-fenetre-deplacee
          fenetre '100 250 300 350'
          sleep 2
          photo 4-fenetre-retrecie
          fenetre nouvelle
          sleep 3
          photo 5-nouvelle-fenetre
          fenetre ferme
          sleep 2
          photo 6-fenetre-fermee
      - name: Chasse-neige
        run: |
          . mac/tests/outils.sh
          pilote chasse
          sleep 6
          photo 8-chasse-neige-en-route
          sleep 14
          photo 9-chasse-neige-passe
      - name: Verrouillage puis déverrouillage
        run: |
          . mac/tests/outils.sh
          ordre com.apple.screenIsLocked
          sleep 2
          photo 10-verrouille
          ordre com.apple.screenIsUnlocked
          sleep 15
          photo 11-deverrouille
      - name: Désactivation puis réactivation
        run: |
          . mac/tests/outils.sh
          pilote off
          sleep 2
          photo 12-desactive
          pilote on
          sleep 12
          photo 13-reactive
      - name: Menu de la barre des menus
        run: |
          . mac/tests/outils.sh
          # le clic ne rend la main qu'à la fermeture du menu : on le lance à part
          osascript -e 'tell application "System Events" to tell process "Flocon" to click menu bar item 1 of menu bar 1' &
          sleep 3
          photo 14-menu
          essai osascript -e 'tell application "System Events" to key code 53'
          sleep 1
          kill %1 2>/dev/null || true
      - name: Maltraitance (ordres en rafale)
        run: |
          . mac/tests/outils.sh
          for i in 1 2 3 4 5 6 7 8; do
            pilote off; pilote on; pilote chasse
            ordre com.apple.screenIsLocked; ordre com.apple.screenIsUnlocked
            fenetre "$((100 + i * 30)) 200 $((250 + i * 40)) 300"
          done
          sleep 5
          photo 15-apres-rafale
      - name: Quitter puis relancer
        run: |
          . mac/tests/outils.sh
          pkill -x Flocon
          sleep 2
          open /Applications/Flocon.app
          sleep 20
          photo 16-relance
          ps -o %cpu=,rss= -p "$(pgrep -x Flocon)" | tee cpu.txt
      - name: Rapports de plantage éventuels
        if: always()
        run: |
          cp ~/Library/Logs/DiagnosticReports/*locon* shots/ 2>/dev/null || true
          if ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i flocon; then echo "::error::Flocon a planté"; exit 1; fi
          echo "aucun plantage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flocon-${{ matrix.os }}
          path: |
            shots
            diag.txt
            cpu.txt
